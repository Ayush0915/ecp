<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Evolve</title>
<style>
:root{
  --bg:#f6f7f9; --surface:#ffffff; --line:#e4e7ec; --line2:#eef0f4; --text:#101828; --mute:#667085; --dim:#98a2b3;
  --accent:#3b5bdb; --accent-bg:#edf1ff; --good:#067647; --good-bg:#e7f6ee; --bad:#b42318; --bad-bg:#fdecea; --warn:#b54708; --warn-bg:#fff4e5;
  --elephant:#6941c6; --elephant-bg:#f1ecfd; --fish:#c4320a; --fish-bg:#fff0e8; --pi:#0e7c66; --pi-bg:#e3f5f0;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; --sans:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --shadow:0 1px 2px rgba(16,24,40,.05);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.55 var(--sans);display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
code,pre,.mono{font-family:var(--mono)}
a{color:var(--accent)}
h1,h2,h3,h4,p{margin:0}
.top{display:flex;align-items:center;gap:16px;padding:0 24px;height:56px;background:var(--surface);border-bottom:1px solid var(--line);flex:none}
.brand{font-weight:700;font-size:16px;letter-spacing:-.01em}
.crumb{color:var(--mute);display:flex;gap:10px;align-items:center;min-width:0;white-space:nowrap}
.crumb b{color:var(--text);font-weight:600}
.sp{flex:1}
.status{display:flex;align-items:center;gap:8px;color:var(--mute);font-size:13px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--dim);flex:none}
.dot.on{background:#12b76a;animation:ping 1.5s infinite}.dot.bad{background:#f04438}
@keyframes ping{70%{box-shadow:0 0 0 7px rgba(18,183,106,0)}0%{box-shadow:0 0 0 0 rgba(18,183,106,.45)}}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 14px;font-weight:600;font-size:13px;box-shadow:var(--shadow);transition:.15s}
.btn:hover{border-color:#c5cbd6;background:#fafbfc}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.08);background:var(--accent)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{padding:4px 10px;font-size:12px}
.link{background:none;border:0;color:var(--accent);padding:0;font-weight:600;cursor:pointer}
.app{flex:1;display:grid;grid-template-columns:minmax(0,1fr);min-height:0}
.side{background:var(--surface);border-right:1px solid var(--line);overflow:auto;padding:20px;display:flex;flex-direction:column;gap:24px}
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.stage{flex:1;overflow:auto;padding:0 32px 40px;scroll-behavior:smooth}
.wrap{max-width:920px;margin:0 auto}
.label{font-size:12px;font-weight:600;color:var(--mute);margin-bottom:8px;letter-spacing:.02em}
input,textarea,select{width:100%;background:var(--surface);border:1px solid #d0d5dd;color:var(--text);border-radius:8px;padding:9px 12px;font:inherit;box-shadow:var(--shadow)}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}
textarea{resize:vertical;min-height:64px}
.row{display:flex;gap:8px}
.hint{color:var(--mute);font-size:12.5px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;box-shadow:var(--shadow)}
/* connect */
.hero{max-width:640px;margin:12vh auto 0;text-align:center}
.hero h1{font-size:30px;letter-spacing:-.02em;margin-bottom:8px}
.hero p{color:var(--mute);font-size:15px;margin-bottom:24px}
.hero .row{text-align:left}
.hero input{padding:12px 14px;font-size:15px}
.hero .btn{padding:0 22px;font-size:14px}
.err{color:var(--bad);background:var(--bad-bg);border-radius:8px;padding:10px 12px;margin-top:12px;text-align:left;font-size:13px}
.examples{margin-top:14px;font-size:12.5px;color:var(--mute)}
.examples code{background:#eceff3;padding:1px 6px;border-radius:5px;cursor:pointer}
.steps{text-align:left;margin-top:26px}
.stp{display:flex;gap:14px;padding:11px 0;border-bottom:1px solid var(--line2);align-items:flex-start}
.stp:last-child{border:0}
.mark{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);flex:none;margin-top:1px;display:grid;place-items:center;font-size:11px;color:#fff}
.stp.done .mark{background:#12b76a;border-color:#12b76a}.stp.fail .mark{background:#f04438;border-color:#f04438}
.stp.going .mark{border-color:var(--accent);border-top-color:transparent;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.stp .t{font-weight:600}.stp.pending .t{color:var(--dim);font-weight:500}
.stp .n{color:var(--mute);font-size:12.5px;word-break:break-word}
.bar{height:6px;background:var(--line2);border-radius:9px;margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent);border-radius:9px;transition:width .3s}
/* repo header */
.rhead{padding:26px 0 8px;display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap}
.rhead h1{font-size:22px;letter-spacing:-.01em}
.meta{color:var(--mute);font-size:13px;display:flex;gap:14px;flex-wrap:wrap;margin-top:4px}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;background:#eceff3;color:#475467}
.chip.good{background:var(--good-bg);color:var(--good)}.chip.bad{background:var(--bad-bg);color:var(--bad)}.chip.warn{background:var(--warn-bg);color:var(--warn)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:14px 0 0;position:sticky;top:0;background:var(--bg);z-index:6;padding-top:6px}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;color:var(--mute);padding:10px 14px;font-weight:600;margin-bottom:-1px}
.tabs button.on{color:var(--text);border-color:var(--accent)}
.pad{padding-top:22px}
.actions{display:flex;gap:10px;align-items:center;margin:18px 0 6px}.actions input{flex:1;padding:11px 14px}.actions .btn{padding:10px 18px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.fgrid .finding{margin:0;display:flex;flex-direction:column}.fgrid .finding .btn{margin-top:auto;align-self:flex-start}
.block{margin-top:26px}.block>.label{font-size:13px}
.yaml{background:#fbfcfe;border:1px solid var(--line);border-left:3px solid var(--elephant);border-radius:12px;padding:16px 20px;font-family:var(--mono);font-size:12.5px;line-height:1.75;overflow:auto;box-shadow:var(--shadow)}
.yaml .ln{white-space:pre-wrap;word-break:break-word}.yaml.anim .ln{opacity:0;animation:rise .25s forwards}
.yaml .k{color:#6941c6}.yaml .s{color:#067647}.yaml .n{color:#b54708}.yaml .c{color:#98a2b3}.yaml .no{color:var(--bad)}
.yhead{display:flex;gap:10px;align-items:center;margin-bottom:8px;color:var(--mute);font-size:12.5px}.yhead b{font-family:var(--mono);color:var(--text)}
/* sidebar content */
.finding{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px}
.finding .t{font-weight:600;line-height:1.35;margin:6px 0 4px}
.finding .f{color:var(--mute);font-size:12px;margin-bottom:10px}
.ev{display:inline-flex;gap:3px;vertical-align:middle;margin-right:6px}.ev b{width:12px;height:4px;border-radius:2px;background:#dde1e8}.ev b.on{background:#12b76a}
.mtag{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--mute)}
.run{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:8px;cursor:pointer;margin:0 -10px}
.run:hover{background:var(--bg)}.run.sel{background:var(--accent-bg)}
.run .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* stage sections */
.sec{margin-bottom:28px;animation:rise .4s both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hd{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.av{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-weight:700;font-size:15px;flex:none}
.av.elephant{background:var(--elephant-bg);color:var(--elephant)}.av.fish{background:var(--fish-bg);color:var(--fish)}.av.pi{background:var(--pi-bg);color:var(--pi)}.av.code{background:#eceff3;color:#475467}
.av.working{animation:glow 1.6s infinite}
@keyframes glow{50%{box-shadow:0 0 0 6px rgba(59,91,219,.12)}}
.hd h2{font-size:16px;letter-spacing:-.005em}.hd .sub{color:var(--mute);font-size:12.5px}
.st{margin-left:auto;font-size:12.5px;font-weight:600;white-space:nowrap;display:flex;align-items:center;gap:7px;color:var(--mute)}
.st.working{color:var(--accent)}.st.done{color:var(--good)}.st.fail,.st.error{color:var(--bad)}
.spin{display:inline-block;width:12px;height:12px;border-radius:50%;border:2px solid #d0d5dd;border-top-color:var(--accent);animation:sp .8s linear infinite}
.think{display:flex;align-items:center;gap:12px;padding:16px 18px;border:1px dashed #cfd4dc;border-radius:12px;color:var(--mute);background:var(--surface)}
.dots span{display:inline-block;width:6px;height:6px;margin-right:4px;border-radius:50%;background:var(--elephant);animation:dot 1.2s infinite}
.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,80%,100%{opacity:.25}40%{opacity:1}}
/* the plan document */
.ecp{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--elephant);border-radius:12px;padding:24px 28px;box-shadow:var(--shadow)}
.ecp .top2{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.ecp .idc{font-family:var(--mono);font-weight:700;color:var(--elephant)}
.ecp h3{font-size:22px;letter-spacing:-.015em;line-height:1.25;margin-bottom:6px}
.ecp .blk{margin-top:18px}
.ecp .blk>h4{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--mute);margin-bottom:6px}
.ecp ul{margin:0;padding-left:18px}.ecp li{margin:2px 0}
.ecp .pth{display:inline-block;font-family:var(--mono);font-size:12px;padding:2px 8px;border-radius:6px;margin:2px 6px 2px 0;background:var(--accent-bg);color:var(--accent)}
.ecp .pth.no{background:var(--bad-bg);color:var(--bad)}
.ecp .cmd{font-family:var(--mono);font-size:12px;color:var(--mute)}
.ecp .approach{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px 14px;font-size:13px}
.ecp.anim .blk,.ecp.anim h3,.ecp.anim .top2{opacity:0;animation:rise .5s forwards}
.lock{margin-top:20px;padding:10px 14px;border-radius:8px;background:var(--good-bg);color:var(--good);font-size:13px;font-weight:500}
.lock code{font-size:12px}
.fold{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--elephant);border-radius:12px;padding:10px 16px;box-shadow:var(--shadow)}
.fold>summary{cursor:pointer;font-weight:600}.fold .ecp{margin-top:12px;border:0;border-top:1px solid var(--line2);border-radius:0;padding:16px 0 4px;box-shadow:none}
/* goldfish */
.round{margin-bottom:18px}.round>.rt{font-size:12.5px;color:var(--mute);margin-bottom:10px;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.gf{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;min-height:104px;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.gf.working{border-color:#b9c6f5}
.gf.working::after{content:"";position:absolute;left:0;top:0;height:2px;width:40%;background:var(--accent);animation:scan 1.4s ease-in-out infinite}
@keyframes scan{from{left:-40%}to{left:100%}}
.gf.clean{border-color:#abefc6}.gf.blocker{border-color:#fda29b}
.gf .tp{display:flex;align-items:center;gap:10px}
.gf .nm{font-weight:600;text-transform:capitalize}.gf .md{font-size:11px;color:var(--dim);font-family:var(--mono)}
.gf .rs{margin-left:auto;font-size:12.5px;font-weight:600;white-space:nowrap}
.gf .why{font-size:12.5px;color:var(--mute)}
.fnd{border-left:3px solid var(--line);padding:6px 10px;background:var(--bg);border-radius:0 8px 8px 0;font-size:12.5px;animation:rise .3s both}
.fnd.blocker{border-color:#f04438}.fnd.major{border-color:#f79009}.fnd.nit{border-color:var(--dim)}
.fnd b{text-transform:uppercase;font-size:10.5px;letter-spacing:.06em;margin-right:4px}
.fnd.blocker b{color:var(--bad)}.fnd.major b{color:var(--warn)}
/* pi, verify, decision */
.term{background:#101828;color:#e4e7ec;border-radius:12px;padding:14px 16px;font-family:var(--mono);font-size:12.5px}
.act{display:flex;gap:12px;padding:3px 0;animation:rise .25s both}
.act .k{width:50px;color:#98a2b3}.act .p{flex:1;word-break:break-all}.act .ok{color:#75e0a7}.act .no{color:#fda29b}
.act.blocked{background:rgba(240,68,56,.14);margin:2px -8px;padding:3px 8px;border-radius:6px}
.ck{display:flex;gap:12px;align-items:flex-start;padding:12px 16px;background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-bottom:8px}
.ck .nt{color:var(--mute);font-size:12px;font-family:var(--mono);word-break:break-word}
.diff{background:#101828;border-radius:10px;padding:10px 0;font-family:var(--mono);font-size:12px;max-height:360px;overflow:auto;margin-top:10px}
.diff div{padding:0 14px;white-space:pre;color:#98a2b3}.diff .a{background:rgba(18,183,106,.16);color:#a6f4c5}.diff .d{background:rgba(240,68,56,.16);color:#fecdca}.diff .h{color:#8098f9}
.verdict{border-radius:12px;padding:18px 22px;border:1px solid}
.verdict h2{font-size:18px;margin-bottom:4px}.verdict ul{margin:6px 0 0;padding-left:18px;color:var(--mute)}
.verdict.good{background:var(--good-bg);border-color:#abefc6}.verdict.bad{background:var(--bad-bg);border-color:#fda29b}.verdict.mid{background:var(--warn-bg);border-color:#fedf89}
.gate{display:flex;gap:10px;align-items:center;padding:10px 14px;border-radius:10px;font-size:13px;border:1px solid var(--line);background:var(--surface)}
.gate b{font-weight:600}
/* progress line */
.pipe{display:flex;margin:22px 0 24px;position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0}
.ps{flex:1;text-align:center;color:var(--dim);font-size:12.5px;font-weight:600;position:relative;padding-top:20px}
.ps::before{content:"";position:absolute;top:5px;left:-50%;width:100%;height:2px;background:var(--line)}.ps:first-child::before{display:none}
.ps::after{content:"";position:absolute;top:0;left:calc(50% - 6px);width:12px;height:12px;border-radius:50%;background:var(--bg);border:2px solid var(--line)}
.ps.done{color:var(--text)}.ps.done::before{background:#12b76a}.ps.done::after{background:#12b76a;border-color:#12b76a}
.ps.active{color:var(--accent)}.ps.active::after{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-bg)}
.ps.fail::after{background:#f04438;border-color:#f04438}
.empty{text-align:center;padding:80px 0;color:var(--mute)}.empty h2{color:var(--text);font-size:20px;margin-bottom:6px}
/* dock */
.dock{height:210px;border-top:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;flex:none}
.dock.min{height:40px}
.dock .bar2{display:flex;gap:4px;align-items:center;padding:6px 20px;border-bottom:1px solid var(--line2);flex:none}
.dock .tb{background:none;border:0;color:var(--mute);padding:3px 10px;border-radius:6px;font-weight:600;font-size:12.5px}.dock .tb.on{background:var(--bg);color:var(--text)}
.log{flex:1;overflow:auto;padding:8px 20px;font-family:var(--mono);font-size:12px}
.log .l{display:flex;gap:12px;padding:1px 0}.log .tm{color:var(--dim);flex:none}.log .who{flex:none;width:72px;font-weight:700}
.who.elephant{color:var(--elephant)}.who.goldfish{color:var(--fish)}.who.pi{color:var(--pi)}.who.system,.who.gate{color:var(--mute)}.who.verify{color:var(--good)}
.log .msg{white-space:pre-wrap;word-break:break-word}
.banner{background:var(--warn-bg);border:1px solid #fedf89;border-radius:10px;padding:12px 16px;margin:20px 0 0;display:flex;gap:12px;align-items:center}.banner span{flex:1}
.rbar{display:flex;gap:12px;align-items:center;padding:10px 0}.rbar input[type=range]{flex:1;padding:0;box-shadow:none}
/* modal */
.modal{position:fixed;inset:0;background:rgba(16,24,40,.45);display:none;place-items:center;z-index:50}.modal.on{display:grid}
.mbox{width:min(600px,94vw);max-height:92vh;overflow:auto;background:var(--surface);border-radius:16px;padding:26px 28px;box-shadow:0 20px 50px rgba(16,24,40,.25)}
.mbox h2{font-size:20px;margin-bottom:4px}.fld{margin:12px 0}.fld label{display:block;font-size:12.5px;font-weight:600;color:#344054;margin-bottom:5px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.okc{color:var(--good)}.badc{color:var(--bad)}
details.p{border:1px solid var(--line);border-radius:10px;padding:8px 14px;margin-bottom:8px;background:var(--surface)}
details.p summary{cursor:pointer;font-weight:600}details.p pre{margin:8px 0 0;white-space:pre-wrap;word-break:break-word;font-size:12px}
@media (max-width:900px){.two,.fgrid{grid-template-columns:1fr}}
</style>
</head>
<body>

<div class="top">
  <span class="brand">Evolve</span>
  <div class="crumb" id="crumb"></div>
  <div class="sp"></div>
  <div class="status"><span class="dot" id="livedot"></span><span id="livetxt">Idle</span></div>
  <div class="status" id="azstat" style="cursor:pointer"><span class="dot" id="azdot"></span><span id="aztxt">Azure</span></div>
  <button class="btn" id="settingsbtn">Settings</button>
</div>

<div class="app" id="app">
  <main class="main">
    <div class="stage" id="stage"></div>
    <div class="dock" id="dock" style="display:none">
      <div class="bar2"><button class="tb on" data-d="act">Activity</button><button class="tb" data-d="raw">Raw output</button><span class="sp"></span><button class="tb" id="dockmin">Hide</button></div>
      <div class="log" id="log"></div>
    </div>
  </main>
</div>

<div class="modal" id="modal"><div class="mbox" id="mbox"></div></div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const get = u => fetch(u).then(r => r.json());
const post = (u, b) => fetch(u, {method: "POST", headers: {"content-type": "application/json"}, body: JSON.stringify(b || {})}).then(r => r.json());
const S = {ov: null, live: null, ing: null, events: [], after: 0, tab: "live", sel: null, replay: null, rpos: 0, dock: "act", detail: null,
           seenAnim: new Set(), paint: {}, follow: true, replayFast: false, azOk: null, azAt: 0, openEcp: false, switching: false};

// ======================================================================= events -> what to draw
function reduce(evs) {
  const m = {job: "", signals: null, signalsSince: 0, claims: [], proposed: null, discovery: null, elephant: {state: "idle"}, ecp: null, version: 1, hist: [],
             rounds: [], gates: [], locked: null, pi: null, verify: null, decision: null, phase: "", prep: {order: [], steps: {}, done: null}};
  for (const e of evs) {
    const d = e.data;
    switch (e.kind) {
      case "job_start": m.job = d.job; break;
      case "prep_start": m.phase = "prep"; break;
      case "prep_step": if (!m.prep.order.includes(d.name)) m.prep.order.push(d.name); m.prep.steps[d.name] = d; break;
      case "prep_done": m.prep.done = d; break;
      case "signals_start": m.signalsSince = e.t; m.phase = "signals"; break;
      case "signals": m.signals = d; m.phase = "signals"; break;
      case "elephant_start": m.elephant = {state: "working", task: d.task, model: d.model, since: e.t, problems: d.problems}; m.phase = d.task === "scout" ? "scout" : "plan"; break;
      case "elephant_done":
        m.elephant = {...m.elephant, state: "done", task: d.task};
        if (d.task === "scout") m.proposed = d.proposed; else { m.ecp = d.ecp; m.version = d.version || 1; m.hist.push(e.seq); }
        break;
      case "review_start": m.rounds.push({phase: d.phase, round: d.round, lenses: d.lenses, cards: {}}); m.phase = d.phase === "before" ? "review" : "after"; break;
      case "goldfish_start":
        if (d.phase === "discover") { m.claims.push({subject: d.subject, state: "working"}); m.phase = "check"; break; }
        { const r = m.rounds[m.rounds.length - 1]; if (r) r.cards[d.lens] = {state: "working", since: e.t, model: d.model}; }

function repoHeader() {
  const r = S.ov.repo, p = S.ov.prepare, b = p && p.baseline;
  return `<div class="rhead"><div><h1>${esc(r.name)}</h1><div class="meta"><span>${esc(r.branch)} @ ${esc(r.commit)}</span><span>${r.files} files</span><span>${(r.languages || []).map(l => esc(l.name)).join(", ") || "no known language"}</span><span>${r.commits} commits</span>${r.url ? `<span class="mono">${esc(r.url.replace(/^https?:\/\//, ""))}</span>` : ""}</div></div><div class="sp"></div>
    <div>${b ? `<span class="chip ${b.ok ? "good" : "bad"}">Baseline tests ${b.ok ? "pass" : "fail"}</span>` : `<span class="chip">No baseline yet</span>`} <button class="link" id="reprep" style="margin-left:8px">Reinstall dependencies</button></div></div>
    ${b && !b.ok && b.detail ? `<details class="p"><summary class="badc">Why the baseline fails</summary><pre>${esc(b.detail)}</pre></details>` : ""}`;
}
async function render() {
  const ov = S.ov, conn = ov && ov.connected, ing = S.ing || {};
  $("dock").style.display = conn || S.events.length ? "" : "none";
  $("crumb").innerHTML = conn ? `<span>/</span><b>${esc(ov.repo.name)}</b><span>${esc(ov.repo.branch)}</span>` : "";
  const st = $("stage"), busy = !!(S.live && S.live.running);
  let html = "";
  const live = S.live || {}, prepRunning = live.running && live.kind === "prepare", ingWorking = ing.state === "working";
  const m = reduce(S.events);
  if (!conn || S.switching) html = (ingWorking ? prepCard(m) : connectCard());
  else if (ingWorking || prepRunning) html = prepCard(m);
  else {
    const rec = S.openRec ? await recordView() : "", files = S.openFiles ? await filesView() : "";
    html = `<div class="wrap">${repoHeader()}
      <div class="actions"><input id="req" placeholder="Describe a change, or let Evolve find problems first"><button class="btn" id="run" ${busy ? "disabled" : ""}>Evolve</button><button class="btn primary" id="disc" ${busy ? "disabled" : ""}>Discover problems</button></div>
      ${findingsHtml()}${runsHtml()}
      <div class="block">${liveView()}</div>
      <div class="block"><details class="p" id="drec" ${S.openRec ? "open" : ""}><summary>Evidence log and plan versions</summary><div style="margin-top:10px">${rec}</div></details>
      <details class="p" id="dfiles" ${S.openFiles ? "open" : ""}><summary>Files in .evolution</summary><div style="margin-top:10px">${files}</div></details>
      <p style="margin-top:14px"><button class="link" id="other">Connect a different repository</button></p></div></div>`;
  }
  if (S.paint.main !== html) {
    const keep = st.scrollTop, focus = document.activeElement && document.activeElement.id;
    st.innerHTML = html; S.paint.main = html;
    const follow = S.follow && (live.running || S.replay);
    if (follow && conn) st.scrollTop = st.scrollHeight; else st.scrollTop = keep;
    if ($("req")) $("req").value = S.req || "";
    if (focus === "repoin" && $("repoin")) $("repoin").focus();
    if (focus === "req" && $("req")) $("req").focus();
    bind();
  }
  tick();
}
function bind() {
  if ($("connect")) { $("connect").onclick = connect; $("repoin").onkeydown = e => { if (e.key === "Enter") connect(); }; $("repoin").oninput = e => S.draft = e.target.value; document.querySelectorAll("[data-ex]").forEach(c => c.onclick = () => { $("repoin").value = c.dataset.ex; S.draft = c.dataset.ex; $("repoin").focus(); }); }
  if ($("req")) { $("req").oninput = e => S.req = e.target.value; $("req").onkeydown = e => { if (e.key === "Enter" && e.target.value.trim()) start("/api/start"); }; }
  if ($("run")) $("run").onclick = () => start("/api/start");
  if ($("disc")) $("disc").onclick = () => start("/api/discover");
  if ($("other")) $("other").onclick = () => { S.switching = true; S.ing = {state: "idle"}; S.paint.main = ""; render(); };
  document.querySelectorAll("[data-fid]").forEach(b => b.onclick = () => start("/api/start", b.dataset.fid));
  document.querySelectorAll("[data-id]").forEach(r => r.onclick = () => openRun(r.dataset.id));
  if ($("drec")) $("drec").ontoggle = e => { if (S.openRec !== e.target.open) { S.openRec = e.target.open; S.paint.main = ""; render(); } };
  if ($("dfiles")) $("dfiles").ontoggle = e => { if (S.openFiles !== e.target.open) { S.openFiles = e.target.open; S.paint.main = ""; render(); } };
  if ($("yes")) { $("yes").onclick = () => post("/api/approve", {approve: true}).then(refresh); $("no").onclick = () => post("/api/approve", {approve: false}).then(refresh); }
  if ($("reprep")) $("reprep").onclick = async () => { const r = await post("/api/prepare"); if (r.error) alert(r.error); S.events = []; S.after = 0; refresh(); };
  if ($("play")) $("play").onclick = play;
  if ($("slider")) $("slider").oninput = e => { stopPlay(); S.rpos = +e.target.value; S.replay.t = S.rpos ? S.events[S.rpos - 1].t : 0; S.replayFast = true; S.paint.main = ""; render(); };
  if ($("golive")) $("golive").onclick = async () => { stopPlay(); S.replay = null; S.follow = true; S.after = 0; S.events = []; S.sel = null; S.paint = {}; await refresh(); };
}
let playT = null;
function stopPlay() { if (playT) { clearTimeout(playT); playT = null; } }
function play() {
  if (playT) { stopPlay(); S.paint.main = ""; return render(); }
  if (S.rpos >= S.events.length) S.rpos = 0;
  S.replayFast = false; S.seenAnim = new Set(); S.follow = true;
  const step = () => {
    if (S.rpos >= S.events.length) { playT = null; S.paint.main = ""; return render(); }
    const cur = S.events[S.rpos]; S.rpos++; S.replay.t = cur.t; render();
    const nxt = S.events[S.rpos]; playT = setTimeout(step, nxt ? Math.min(1400, Math.max(200, (nxt.t - cur.t) * 250)) : 100);
  };
  step();
}
function tick() { document.querySelectorAll("[data-since]").forEach(e => e.textContent = secs(+e.dataset.since) + "s"); }

async function openRun(id) {
  S.sel = id; S.follow = false; S.detail = null; S.seenAnim = new Set(); S.replayFast = true; stopPlay();
  S.events = await get("/api/events?ecp=" + id);
  S.replay = {t: S.events.length ? S.events[S.events.length - 1].t : 0}; S.rpos = S.events.length; S.paint = {}; render();
}
function renderLog() {
  const box = $("log");
  if (S.dock === "raw") { const t = (S.live && S.live.log) || "(nothing yet)"; if (S.paint.log !== "raw" + t) { S.paint.log = "raw" + t; box.innerHTML = `<pre style="margin:0;white-space:pre-wrap">${esc(t)}</pre>`; box.scrollTop = box.scrollHeight; } return; }
  const evs = S.replay ? S.events.slice(0, S.rpos) : S.events, key = "a" + evs.length + (S.replay ? "r" : "") + (evs[0] ? evs[0].seq : "");
  if (S.paint.log === key) return; S.paint.log = key;
  box.innerHTML = evs.map(e => { const [w, t] = describe(e); return `<div class="l"><span class="tm">${hhmmss(e.t)}</span><span class="who ${w}">${w}</span><span class="msg">${esc(t)}</span></div>`; }).join("") || '<span class="hint">Activity from every agent will stream here.</span>';
  box.scrollTop = box.scrollHeight;
}
function describe(e) {
  const d = e.data;
  switch (e.kind) {
    case "job_start": return ["system", ({run: "evolution started", discover: "discovery started", prepare: "preparing the repository"})[d.job] || d.job];
    case "prep_step": return ["system", `${d.name}: ${d.state}${d.note ? " - " + d.note : ""}`];
    case "prep_done": return ["system", d.baseline ? `baseline tests ${d.baseline.ok ? "pass" : "fail"}` : "prepared"];
    case "signals_start": return ["system", "running tests, scanners and git history"];
    case "signals": return ["system", `collected ${d.count} signals from ${Object.keys(d.detectors || {}).length} programs`];
    case "elephant_start": return ["elephant", d.task === "scout" ? `reading the repository to find problems (${d.model})` : d.task === "revise" ? `revising the plan (${d.problems} blocking problem(s))` : `drafting the plan (${d.model})`];
    case "elephant_done": return ["elephant", d.task === "scout" ? `proposed ${d.proposed.length} finding(s)` : `plan ready: ${d.ecp.id} "${d.ecp.title}"`];
    case "review_start": return ["goldfish", `${d.phase === "before" ? "reviewing the plan" : "reviewing the change"}: ${d.lenses.join(", ")}`];
    case "goldfish_start": return ["goldfish", `${d.lens}: started${d.subject ? " - " + d.subject : ""}`];
    case "goldfish_done": return ["goldfish", d.lens === "claim" ? `claim ${d.verdict ? "confirmed" : "REJECTED"}: ${d.subject}` : `${d.lens}: ${d.error ? "ERROR " + d.error : (d.findings.length ? d.findings.length + " finding(s)" : "clean")}${d.seconds != null ? ` (${d.seconds}s)` : ""}`];
    case "review_done": return ["goldfish", `${d.phase} review finished, ${d.blocking} blocking`];
    case "gate": return ["gate", `${d.stage}: ${d.go ? "GO" : "STOP"} - ${d.how}`];
    case "locked": return ["gate", `plan locked (${String(d.hash).slice(0, 12)})`];
    case "pi_start": return ["pi", `building on ${d.branch}`];
    case "pi_action": return ["pi", `${d.tool} ${d.path} ${d.allowed ? "allowed" : "BLOCKED"}`];
    case "pi_done": return ["pi", `finished: ${d.applied} applied, ${d.blocked} blocked${d.error ? " - " + d.error : ""}`];
    case "verify_start": return ["verify", "running checks"];
    case "verify_step": return ["verify", `${d.name}: ${d.state}${d.note ? " - " + d.note : ""}`];
    case "verify_done": return ["verify", d.summary];
    case "decision": return ["system", `decision: ${d.outcome}`];
    case "discovery_done": return ["system", `${d.kept.length} finding(s) kept, ${d.dropped.length} dropped`];
  }
  return ["system", e.kind];
}

async function refresh() {
  try {
    const [ov, live, ing] = await Promise.all([get("/api/overview"), get("/api/live"), get("/api/ingest")]);
    const was = S.ov && S.ov.connected && S.ov.repo && S.ov.repo.name;
    S.ov = ov; S.live = live; S.ing = ing;
    if (ov.connected && ing.state === "done" && S.switching) S.switching = false;
    if (ov.connected && was && was !== ov.repo.name) { S.events = []; S.after = 0; S.paint = {}; S.sel = null; S.replay = null; }
    if (!S.replay && ov.connected) {
      const more = await get("/api/events?after=" + S.after);
      if (more.length) { S.events = S.events.concat(more); S.after = more[more.length - 1].seq; }
      else if (S.after > 0 && live.running) { const first = await get("/api/events?after=0"); if (first.length && first.length < S.events.length) { S.events = first; S.after = first[first.length - 1].seq; S.paint = {}; S.seenAnim = new Set(); } }
    }
    const k = live.running ? ({prepare: "Preparing the repository", discover: "Discovering problems", run: "Evolving"}[live.kind] || "Working") : ing.state === "working" ? "Downloading" : "Idle";
    $("livedot").className = "dot" + (live.running || ing.state === "working" ? " on" : ""); $("livetxt").textContent = k;
    await azure(); renderLog(); await render();
  } catch (e) { $("livedot").className = "dot bad"; $("livetxt").textContent = "Dashboard offline"; }
}
async function azure() {
  if (Date.now() - S.azAt < 15000) return; S.azAt = Date.now();
  const a = await get("/api/azure"); S.az = a;
  $("azdot").className = "dot " + (a.missing.length ? "bad" : "on"); $("aztxt").textContent = a.missing.length ? "Azure not set up" : "Azure: " + (a.values.AZURE_OPENAI_DEPLOYMENT || "ready");
}
async function start(kind, finding) {
  if (S.az && S.az.missing.length) return openSettings();
  const r = await post(kind, {request: finding ? "" : (S.req || ""), finding: finding || null});
  if (r.error) return alert(r.error);
  stopPlay(); S.replay = null; S.events = []; S.after = 0; S.paint = {}; S.follow = true; S.sel = null; S.seenAnim = new Set(); S.replayFast = false;
  setTimeout(refresh, 300);
}
async function connect() {
  const v = $("repoin").value.trim(); S.draft = v;
  const r = await post("/api/connect", {repo: v});
  if (r.error) { S.ing = {...(S.ing || {}), state: "error", error: r.error}; S.paint.main = ""; return render(); }
  S.events = []; S.after = 0; S.paint = {}; S.replay = null; S.sel = null; S.ing = {state: "working", lines: [], percent: 0, spec: v}; refresh();
}
$("dock").querySelectorAll("[data-d]").forEach(b => b.onclick = () => { S.dock = b.dataset.d; S.paint.log = ""; $("dock").querySelectorAll("[data-d]").forEach(x => x.classList.toggle("on", x === b)); renderLog(); });
$("dockmin").onclick = () => { const mn = $("dock").classList.toggle("min"); $("dockmin").textContent = mn ? "Show" : "Hide"; };

// ======================================================================= settings
async function openSettings() {
  const [a, st] = await Promise.all([get("/api/azure"), S.ov && S.ov.connected ? get("/api/settings") : Promise.resolve({})]);
  const v = a.values, sec = a.secrets, f = (id, label, val, ph, type) => `<div class="fld"><label>${label}</label><input id="${id}" type="${type || "text"}" value="${esc(val || "")}" placeholder="${esc(ph || "")}"></div>`;
  $("mbox").innerHTML = `<h2>Settings</h2><p class="hint">Azure OpenAI connection. Saved to the project's .env file (git ignores it). Secrets are never shown again.</p>
    ${f("AZURE_OPENAI_BASE", "AZURE_OPENAI_BASE", v.AZURE_OPENAI_BASE, "https://your-resource.openai.azure.com")}
    <div class="two">${f("AZURE_OPENAI_DEPLOYMENT", "AZURE_OPENAI_DEPLOYMENT", v.AZURE_OPENAI_DEPLOYMENT, "your chat deployment")}${f("AZURE_OPENAI_API_VERSION", "AZURE_OPENAI_API_VERSION", v.AZURE_OPENAI_API_VERSION, "2024-10-21")}</div>
    ${f("AZURE_OPENAI_API_KEY", "AZURE_OPENAI_API_KEY", "", sec.AZURE_OPENAI_API_KEY ? "saved (leave empty to keep)" : "API key", "password")}
    <p class="hint">Or leave the key empty and use a service principal:</p>
    <div class="two">${f("AZURE_OPENAI_TENANTID", "AZURE_OPENAI_TENANTID", v.AZURE_OPENAI_TENANTID)}${f("AZURE_OPENAI_CLIENTID", "AZURE_OPENAI_CLIENTID", v.AZURE_OPENAI_CLIENTID)}</div>
    ${f("AZURE_OPENAI_CLIENTSECRET", "AZURE_OPENAI_CLIENTSECRET", "", sec.AZURE_OPENAI_CLIENTSECRET ? "saved (leave empty to keep)" : "client secret", "password")}
    <div class="row" style="margin-top:6px"><button class="btn primary" id="azsave">Save and test</button><span class="sp"></span><button class="btn" id="mclose">Close</button></div>
    <div id="aznote" class="hint" style="margin-top:10px"></div>
    ${S.ov && S.ov.connected ? `<hr style="border:0;border-top:1px solid var(--line);margin:22px 0"><h2 style="font-size:16px">This repository</h2>
    ${f("m_test", "Test command", st.test_command)}
    <div class="fld"><label>Run Pi</label><select id="m_sandbox"><option value="none" ${st.sandbox === "none" ? "selected" : ""}>On this computer, fenced by the scope guard</option><option value="podman" ${st.sandbox === "podman" ? "selected" : ""}>Inside a Podman container</option></select></div>
    <details><summary class="hint" style="cursor:pointer">Use different Azure deployments per role (optional)</summary>${f("m_elephant", "Elephant (planner)", st.elephant, "empty = AZURE_OPENAI_DEPLOYMENT")}${f("m_goldfish", "Goldfish (reviewers)", st.goldfish, "empty = AZURE_OPENAI_DEPLOYMENT")}${f("m_correctness", "Goldfish: correctness reviewer", st.correctness, "empty = same as reviewers")}</details>
    <div class="row" style="margin-top:12px"><button class="btn" id="msave">Save repository settings</button><button class="btn" id="check">Check setup</button></div><div id="checks" style="margin-top:12px"></div>` : ""}`;
  $("modal").classList.add("on");
  $("azsave").onclick = async () => {
    const body = {}; for (const k of ["AZURE_OPENAI_BASE", "AZURE_OPENAI_DEPLOYMENT", "AZURE_OPENAI_API_VERSION", "AZURE_OPENAI_API_KEY", "AZURE_OPENAI_TENANTID", "AZURE_OPENAI_CLIENTID", "AZURE_OPENAI_CLIENTSECRET"]) body[k] = $(k).value;
    const r = await post("/api/azure", body); if (r.error) { $("aznote").innerHTML = `<span class="badc">${esc(r.error)}</span>`; return; }
    $("aznote").textContent = "Saved. Testing the connection..."; const c = await post("/api/azure/check");
    $("aznote").innerHTML = c.ok ? `<span class="okc">${esc(c.note)}</span>` : `<span class="badc">${esc(c.note)}</span>`; S.azAt = 0; azure();
  };
  if ($("msave")) {
    $("msave").onclick = async () => { const r = await post("/api/settings", {test_command: $("m_test").value, sandbox: $("m_sandbox").value, elephant: $("m_elephant").value, goldfish: $("m_goldfish").value, correctness: $("m_correctness").value}); $("checks").innerHTML = r.error ? `<span class="badc">${esc(r.error)}</span>` : '<span class="okc">Saved.</span>'; };
    $("check").onclick = async () => { const r = await get("/api/doctor"); $("checks").innerHTML = r.checks.map(c => `<div class="${c.ok ? "okc" : "badc"}">${c.ok ? "&#10003;" : "&#10007;"} ${esc(c.text)}${c.ok ? "" : ` <span class="hint">${esc(c.fix)}</span>`}</div>`).join(""); };
  }
  $("mclose").onclick = () => $("modal").classList.remove("on");
}
$("settingsbtn").onclick = openSettings; $("azstat").onclick = openSettings;
$("modal").onclick = e => { if (e.target === $("modal")) $("modal").classList.remove("on"); };

setInterval(() => { if (!S.replay) tick(); }, 1000);
setInterval(refresh, 1000);
refresh();
</script>
